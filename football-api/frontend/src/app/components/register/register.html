<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
      <section class="card bg-dark border-primary shadow">
        <div class="card-body p-4">
          <h1 class="h3 text-center text-primary mb-4">Football API</h1>
          <p class="text-secondary text-center">Crear una cuenta</p>

          <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
            {{ errorMessage }}
          </div>

          <form [formGroup]="form" (ngSubmit)="submit()">
            <label class="form-label text-light" for="email">Email</label>
            <input
              id="email"
              type="email"
              class="form-control mb-3"
              formControlName="email"
              autocomplete="email"
              placeholder="usuario@ejemplo.com"
            />

            <label class="form-label text-light" for="password">Contraseña</label>
            <input
              id="password"
              type="password"
              class="form-control mb-4"
              formControlName="password"
              autocomplete="new-password"
              placeholder="Mínimo 8 caracteres"
            />

            <button
              class="btn btn-primary w-100"
              type="submit"
              [disabled]="isSubmitting"
            >
              {{ isSubmitting ? 'Registrando...' : 'Registrarse' }}
            </button>
          </form>

          <p class="text-center text-secondary mt-3 mb-0">
            ¿Ya tenés cuenta?
            <a class="link-primary" routerLink="/login">Iniciar sesión</a>
          </p>
        </div>
      </section>
    </div>
  </div>
</main>
